<!doctype html><html><head><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet"><style>
*{margin:0;box-sizing:border-box}html,body{width:400px;height:400px;overflow:hidden}
body{font-family:Inter,sans-serif;color:#eef2ff;background:#05070d;position:relative}
.bg{position:absolute;inset:0;background:radial-gradient(60% 80% at 80% 0%,rgba(61,123,255,.35),transparent 70%),radial-gradient(50% 70% at 0% 100%,rgba(127,212,255,.14),transparent 70%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(to right,rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(to bottom,rgba(255,255,255,.05) 1px,transparent 1px);background-size:40px 40px;-webkit-mask-image:radial-gradient(70% 90% at 60% 30%,#000,transparent)}
.wave{position:absolute;left:0;right:0;bottom:0}
.mono{font-family:'JetBrains Mono',monospace}
.grad{background:linear-gradient(90deg,#3d7bff,#7fd4ff);-webkit-background-clip:text;color:transparent}
.pill{display:inline-flex;align-items:center;gap:10px;border:1px solid #27314a;background:rgba(11,15,26,.8);border-radius:999px;padding:8px 16px;color:#8a93ab}
.dot{width:9px;height:9px;border-radius:50%;background:#3d7bff;box-shadow:0 0 12px #3d7bff}
</style></head><body><div class="bg"></div><div class="grid"></div><svg class="wave" viewBox="0 0 1500 120" preserveAspectRatio="none" height="90" width="100%"><path d="M0 70 C250 20 500 120 750 70 S1250 20 1500 70 V120 H0Z" fill="rgba(61,123,255,.10)"/><path d="M0 90 C300 50 550 130 800 90 S1300 50 1500 90 V120 H0Z" fill="rgba(61,123,255,.16)"/></svg><div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center"><div style="filter:drop-shadow(0 20px 50px rgba(61,123,255,.55))"><svg viewBox="0 0 32 32" width="230" height="230"><rect width="32" height="32" rx="9" fill="#3d7bff"/><path fill="#fff" d="M16.6 5.5v10.3h8.2z"/><path fill="#fff" fill-opacity=".55" d="M15 8.5v7.3H9.4z"/><path fill="#fff" d="M5.5 18h21l-3.6 4.6H9.1z"/><path fill="#0b1640" d="M14.2 22.6h3.6L16 27.5z"/></svg></div></div></body></html>
