<!doctype html><html><head><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet"><style>
*{margin:0;box-sizing:border-box}html,body{width:1200px;height:630px;overflow:hidden}
body{font-family:Inter,sans-serif;color:#eef2ff;background:#05070d;position:relative}
.bg{position:absolute;inset:0;background:radial-gradient(60% 80% at 80% 0%,rgba(61,123,255,.35),transparent 70%),radial-gradient(50% 70% at 0% 100%,rgba(127,212,255,.14),transparent 70%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(to right,rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(to bottom,rgba(255,255,255,.05) 1px,transparent 1px);background-size:48px 48px;-webkit-mask-image:radial-gradient(70% 90% at 60% 30%,#000,transparent)}
.wave{position:absolute;left:0;right:0;bottom:0}
.mono{font-family:'JetBrains Mono',monospace}
.grad{background:linear-gradient(90deg,#3d7bff,#7fd4ff);-webkit-background-clip:text;color:transparent}
.pill{display:inline-flex;align-items:center;gap:10px;border:1px solid #27314a;background:rgba(11,15,26,.8);border-radius:999px;padding:8px 16px;color:#8a93ab}
.dot{width:9px;height:9px;border-radius:50%;background:#3d7bff;box-shadow:0 0 12px #3d7bff}
